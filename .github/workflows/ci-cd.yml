name: Swiggy Clone CI/CD

on:
  push:
    branches:
      - ci-cd-eks-deployment
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, Scan, Push and Deploy to EKS
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Image Tag
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "Building image with tag: $IMAGE_TAG"

      - name: Build Docker Image
        run: |
          docker build \
            -t jowinshaju/swiggy-clone:${IMAGE_TAG} \
            -t jowinshaju/swiggy-clone:latest .

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: jowinshaju/swiggy-clone:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push Docker Image
        run: |
          docker push jowinshaju/swiggy-clone:${IMAGE_TAG}
          docker push jowinshaju/swiggy-clone:latest

      - name: Deploy to Amazon EKS
        run: |
          kubectl set image deployment/swiggy-deployment \
            swiggy=jowinshaju/swiggy-clone:${IMAGE_TAG}

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/swiggy-deployment --timeout=180s
          kubectl get deployment swiggy-deployment
          kubectl get pods -o wide
          kubectl get service swiggy-svc

  verify-observability:
    name: Verify Prometheus and Grafana
    runs-on: self-hosted
    needs: build-and-deploy

    steps:
      - name: Verify Prometheus
        run: |
          kubectl rollout status \
            statefulset/prometheus-monitoring-kube-prometheus-prometheus \
            -n monitoring --timeout=180s

      - name: Verify Grafana
        run: |
          kubectl rollout status \
            deployment/monitoring-grafana \
            -n monitoring --timeout=180s

      - name: Verify Prometheus Operator
        run: |
          kubectl rollout status \
            deployment/monitoring-kube-prometheus-operator \
            -n monitoring --timeout=180s

      - name: Verify Node Exporter
        run: |
          kubectl rollout status \
            daemonset/monitoring-prometheus-node-exporter \
            -n monitoring --timeout=180s

      - name: Verify kube-state-metrics
        run: |
          kubectl rollout status \
            deployment/monitoring-kube-state-metrics \
            -n monitoring --timeout=180s

      - name: Display Monitoring Resources
        run: |
          echo "===== MONITORING PODS ====="
          kubectl get pods -n monitoring -o wide

          echo "===== MONITORING SERVICES ====="
          kubectl get svc -n monitoring

      - name: Verify Cluster Metrics
        run: |
          echo "===== NODE RESOURCE UTILIZATION ====="
          kubectl top nodes

          echo "===== POD RESOURCE UTILIZATION ====="
          kubectl top pods -n monitoring

